name: macOS ROS 2 jazzy CI (Apple Silicon)

on:
  push:
    branches: [jazzy]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    env:
      CI_BUILD: TRUE
    timeout-minutes: 240

    steps:
    # --------------------------------------------------
    # Checkout repository
    # --------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 0

    - name: Cache git submodules
      uses: actions/cache@v4
      with:
        path: .git/modules
        key: ${{ runner.os }}-git-submodules-${{ github.ref }}
        restore-keys: |
          ${{ runner.os }}-git-submodules-

    - name: Update submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive --jobs 8

    - name: Sync submodule branches
      run: |
        chmod +x scripts/sync-submodules-branches.sh
        ./scripts/sync-submodules-branches.sh

    # --------------------------------------------------
    # Homebrew cache
    # --------------------------------------------------
    - name: Cache Homebrew directories
      uses: actions/cache@v4
      id: cache-brew
      with:
        path: /opt/homebrew
        key: ${{ runner.os }}-brew-v2-${{ hashFiles('brew-packages/install_brew_packages.sh') }}
        restore-keys: |
          ${{ runner.os }}-brew-v2-

    - name: Configure Homebrew parallelism
      run: |
        echo "HOMEBREW_MAKE_JOBS=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV
        echo "HOMEBREW_CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV

    # --------------------------------------------------
    # Homebrew install
    # --------------------------------------------------
    - name: Update Homebrew and install base packages
      run: |
        brew install \
          graphviz \
          eigen@3 \
          eigen \
          GeographicLib \
          vtk
      
        # Symlink eigen3 for standard discovery
        sudo ln -sfn /opt/homebrew/opt/eigen@3/include/eigen3 /opt/homebrew/include/eigen3

    - name: Install Homebrew packages via script
      run: |
        chmod +x brew-packages/install_brew_packages.sh
        ./brew-packages/install_brew_packages.sh

    # --------------------------------------------------
    # Python 3.11
    # --------------------------------------------------
    - name: Python 3.11
      run: |
        export PATH="/Library/Frameworks/Python.framework/Versions/3.11/bin:$PATH"
        which python3
        python3 --version

        echo "/Library/Frameworks/Python.framework/Versions/3.11/bin" >> $GITHUB_PATH
        
        python3 -m pip install --upgrade pip --break-system-packages
        python3 -m pip install -U \
          --break-system-packages \
          --config-settings="--global-option=build_ext" \
          --config-settings="--global-option=-I$(brew --prefix graphviz)/include/" \
          --config-settings="--global-option=-L$(brew --prefix graphviz)/lib/" \
          argcomplete catkin_pkg colcon-common-extensions coverage \
          cryptography empy==3.3.4 flake8 flake8-blind-except==0.1.1 flake8-builtins \
          flake8-class-newline flake8-comprehensions flake8-deprecated \
          flake8-docstrings flake8-import-order flake8-quotes \
          importlib-metadata lark==1.1.1 lxml matplotlib mock mypy==0.931 netifaces \
          nose pep8 psutil pydocstyle pydot pygraphviz pyparsing==2.4.7 \
          pytest-mock rosdep rosdistro setuptools==59.6.0 vcstool typeguard jinja2

    # --------------------------------------------------
    # Environment
    # --------------------------------------------------
    - name: Setup build environment
      run: |
        echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> $GITHUB_ENV
        echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
        echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5):$CMAKE_PREFIX_PATH" >> $GITHUB_ENV
        echo "GZ_VERSION=harmonic" >> $GITHUB_ENV
        echo "CMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/cmake/toolchain.cmake" >> $GITHUB_ENV
  
    # --------------------------------------------------
    # Build External Gazebo Workspace
    # --------------------------------------------------
    - name: Build External Gazebo
      shell: bash
      run: |
        # Create the specific directory structure you requested
        mkdir -p gz-harmonic
        cd gz-harmonic
        git clone --recurse-submodules https://github.com/idesign0/gz-macOS.git -b harmonic .
        cd ..
        brew unlink protobuf || true
        colcon build \
          --packages-select protobuf \
          --executor parallel \
          --parallel-workers $(sysctl -n hw.ncpu) \
          --merge-install \
          --continue-on-error \
          --cmake-args \
          -DCMAKE_TOOLCHAIN_FILE="${CMAKE_TOOLCHAIN_FILE}" \
          -DCI_BUILD=TRUE
  
        colcon build \
          --base-paths gz-harmonic/ --packages-ignore protobuf \
          --executor parallel \
          --parallel-workers $(sysctl -n hw.ncpu) \
          --merge-install \
          --continue-on-error \
          --cmake-args \
          -DCMAKE_TOOLCHAIN_FILE="${CMAKE_TOOLCHAIN_FILE}" \
          -DCI_BUILD=TRUE

    # --------------------------------------------------
    # Homebrew: Unlink packages (ALWAYS run)
    # --------------------------------------------------
    - name: Unlink unwanted Homebrew packages
      run: |
        set +e
        echo "Cleaning conflicting Homebrew packages..."

        # Unlink (headers/libs stay but are not active)
        brew unlink boost || true
        brew unlink boost-python3 || true
        brew unlink xtensor || true
        brew unlink xdm || true
        brew unlink xtl || true
        brew unlink qt || true
        brew unlink asio || true
        brew unlink orocos-kdl || true
        brew uninstall protobuf --ignore-dependencies || true
        brew unlink ceres-solver || true
        brew unlink osqp || true

        echo "Homebrew clean-up completed."

    # --------------------------------------------------
    # Build full workspace
    # --------------------------------------------------
    - name: Build full workspace
      shell: bash
      continue-on-error: true
      run: |
        colcon build \
          --merge-install \
          --executor parallel \
          --parallel-workers $(sysctl -n hw.ncpu) \
          --cmake-clean-cache \
          --continue-on-error \
          --packages-ignore qt_gui_cpp rqt_gui_cpp pal_carbon_collector \
          --cmake-args \
          -DCMAKE_TOOLCHAIN_FILE="${CMAKE_TOOLCHAIN_FILE}" \
          -DCI_BUILD=TRUE     

    # --------------------------------------------------
    # Sanity check
    # --------------------------------------------------
    - name: Source workspace & sanity check
      shell: bash
      run: |
        source install/setup.bash
        ros2 --help
        timeout 5s ros2 run demo_nodes_cpp talker || true

    # --------------------------------------------------
    # Deploy Release + Update Homebrew Formula
    # --------------------------------------------------
    - name: Deploy Release + Update Formula
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      shell: bash
      env:
        TAP_REPO: "idesign0/homebrew-ros2"
        API_TOKEN_GITHUB: ${{ secrets.CATS_DEPLOY_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e

        # --------------------------------------------------
        # Git config
        # --------------------------------------------------
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        # --------------------------------------------------
        # Determine distro from branch
        # --------------------------------------------------
        DISTRO="${GITHUB_REF_NAME}"

        echo "DISTRO=${DISTRO}"

        # --------------------------------------------------
        # Version format: YY.MM.DD.RUN
        # Example: 26.05.11.1
        # --------------------------------------------------
        DATE_VERSION=$(date +"%y.%m.%d")
        VERSION="${DATE_VERSION}.${GITHUB_RUN_NUMBER}"

        echo "VERSION=${VERSION}"

        # --------------------------------------------------
        # Archive naming
        # --------------------------------------------------
        ARCHIVE_NAME="ros2-${DISTRO}-macos-${VERSION}.tar.gz"

        echo "ARCHIVE_NAME=${ARCHIVE_NAME}"

        # --------------------------------------------------
        # Verify install folder
        # --------------------------------------------------
        if [ ! -d "install" ]; then
          echo "ERROR: install directory not found!"
          exit 1
        fi

        # --------------------------------------------------
        # Create tar.gz
        # --------------------------------------------------
        tar -czf "${ARCHIVE_NAME}" install

        # --------------------------------------------------
        # Generate SHA256
        # --------------------------------------------------
        SHA256=$(shasum -a 256 "${ARCHIVE_NAME}" | awk '{print $1}')

        echo "SHA256=${SHA256}"

        # --------------------------------------------------
        # Release tag
        # Example:
        # jazzy-26.05.11.1
        # --------------------------------------------------
        RELEASE_TAG="${DISTRO}-${VERSION}"

        echo "RELEASE_TAG=${RELEASE_TAG}"

        # --------------------------------------------------
        # Create GitHub Release
        # --------------------------------------------------
        GH_TOKEN="${API_TOKEN_GITHUB}" gh release create "${RELEASE_TAG}" \
          --repo "${TAP_REPO}" \
          --title "${DISTRO} ${VERSION}" \
          --notes "ROS 2 ${DISTRO} macOS build ${VERSION}" \
          "${ARCHIVE_NAME}"

        # --------------------------------------------------
        # Clone Homebrew tap repo
        # --------------------------------------------------
        git clone "https://${API_TOKEN_GITHUB}@github.com/${TAP_REPO}.git" tap_repo

        cd tap_repo

        # --------------------------------------------------
        # Formula file
        # --------------------------------------------------
        FORMULA_FILE="Formula/ros2-${DISTRO}.rb"

        if [ ! -f "${FORMULA_FILE}" ]; then
          echo "ERROR: Formula file not found: ${FORMULA_FILE}"
          exit 1
        fi

        # --------------------------------------------------
        # Update version
        # --------------------------------------------------
        sed -i '' "s/version \".*\"/version \"${VERSION}\"/" "${FORMULA_FILE}"

        # --------------------------------------------------
        # Update SHA256
        # --------------------------------------------------
        sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" "${FORMULA_FILE}"

        # --------------------------------------------------
        # Commit changes
        # --------------------------------------------------
        git add "${FORMULA_FILE}"

        git commit -m "Update ros2-${DISTRO} to ${VERSION}" || echo "No changes"

        # --------------------------------------------------
        # Push changes
        # --------------------------------------------------
        git push
