name: macOS ROS 2 Humble CI (Apple Silicon)

on:
  push:
    branches: [humble]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      CI_BUILD: TRUE
    timeout-minutes: 360

    steps:
    # --------------------------------------------------
    # Checkout (NO submodules here)
    # --------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 0

    # --------------------------------------------------
    # Cache git submodule objects ONLY
    # --------------------------------------------------
    - name: Cache git submodules
      uses: actions/cache@v4
      with:
        path: .git/modules
        key: ${{ runner.os }}-git-submodules-${{ github.ref }}
        restore-keys: |
          ${{ runner.os }}-git-submodules-

    # --------------------------------------------------
    # Init & update submodules (FAST after first run)
    # --------------------------------------------------
    - name: Update submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive --jobs 8

    - name: Sync submodule branches
      run: |
        chmod +x scripts/sync-submodules-branches.sh
        ./scripts/sync-submodules-branches.sh

    # --------------------------------------------------
    # Homebrew Caching/Installation
    # --------------------------------------------------
    - name: Cache Homebrew directories
      uses: actions/cache@v4
      id: cache-brew
      with:
        path: /opt/homebrew
        # Key based on OS, version, and hash of your installation script
        key: ${{ runner.os }}-brew-v1-${{ hashFiles('brew-packages/install_brew_packages.sh') }}
        restore-keys: |
          ${{ runner.os }}-brew-v1-
    
    - name: Configure Homebrew parallelism
      run: |
        echo "HOMEBREW_MAKE_JOBS=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV
        echo "HOMEBREW_CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV

    # Homebrew: Conditional Install (runs only on cache miss)
    - name: Update Homebrew and Install Base Packages
      if: steps.cache-brew.outputs.cache-hit != 'true'
      run: |
        # Install taps and base packages required before the main install script runs
        brew tap osrf/simulation
        brew install graphviz eigen@3 GeographicLib

    - name: Install Homebrew packages via script
      if: steps.cache-brew.outputs.cache-hit != 'true'
      run: |
        chmod +x brew-packages/install_brew_packages.sh
        ./brew-packages/install_brew_packages.sh

    # --------------------------------------------------
    # Homebrew: Set PATH (ALWAYS run)
    # --------------------------------------------------
    # Ensure /opt/homebrew/bin is in the PATH for all subsequent steps, regardless of cache hit/miss.
    - name: Set Homebrew PATH
      run: |
        echo "/opt/homebrew/bin" >> $GITHUB_PATH
    
    # --------------------------------------------------
    # Homebrew: Unlink packages (ALWAYS run)
    # --------------------------------------------------
    - name: Unlink unwanted Homebrew packages
      run: |
        set +e
        echo "Cleaning conflicting Homebrew packages..."

        # Unlink (headers/libs stay but are not active)
        brew unlink boost || true
        brew unlink boost-python3 || true
        brew unlink xtensor || true
        brew unlink xdm || true
        brew unlink xtl || true
        brew unlink qt || true
        brew unlink asio || true

        echo "Homebrew cleanup completed."

        # Homebrew: Uninstall conflicting packages (vendor override)
    # --------------------------------------------------
    - name: Uninstall conflicting Homebrew packages
      run: |
        set +e
        echo "Uninstalling Homebrew packages that conflict with vendor builds..."

        if brew list --versions orocos-kdl >/dev/null 2>&1; then
          echo "Removing Homebrew orocos-kdl (version mismatch with vendor)..."
          brew uninstall --ignore-dependencies orocos-kdl
        else
          echo "orocos-kdl not installed"
        fi

        if brew list --versions octomap >/dev/null 2>&1; then
          echo "Removing Homebrew octomap (MoveIt / geometric_shapes conflict)..."
          brew uninstall --ignore-dependencies octomap
        else
          echo "octomap not installed"
        fi

        echo "Homebrew uninstall step completed."
    # --------------------------------------------------
    # Python 3.11 (SYSTEM Python, NOT Homebrew)
    # --------------------------------------------------
    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Verify Python
      run: |
        which python3
        python3 --version

    - name: Install Python dependencies (system Python)
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install -U \
          --config-settings="--global-option=build_ext" \
          --config-settings="--global-option=-I$(brew --prefix graphviz)/include/" \
          --config-settings="--global-option=-L$(brew --prefix graphviz)/lib/" \
          argcomplete catkin_pkg colcon-common-extensions coverage \
          cryptography empy==3.3.4 flake8 flake8-blind-except==0.1.1 \
          flake8-builtins flake8-class-newline flake8-comprehensions \
          flake8-deprecated flake8-docstrings flake8-import-order \
          flake8-quotes importlib-metadata lark==1.1.1 lxml \
          matplotlib mock mypy==0.931 netifaces nose pep8 psutil \
          pydocstyle pydot pygraphviz pyparsing==2.4.7 \
          pytest-mock rosdep rosdistro setuptools==59.6.0 \
          vcstool typeguard jinja2
    # --------------------------------------------------
    # Environment
    # --------------------------------------------------
    - name: Setup build environment
      run: |
        QT_ROOT=$(brew --prefix qt@5)

        echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> $GITHUB_ENV
        echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
        echo "CMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/install:${QT_ROOT}" >> $GITHUB_ENV
        echo "GZ_VERSION=harmonic" >> $GITHUB_ENV
        echo "GZ_SIM_SYSTEM_PLUGIN_PATH=${GITHUB_WORKSPACE}/install/gz_ros2_control/lib" >> $GITHUB_ENV
        echo "DYLD_LIBRARY_PATH=${GITHUB_WORKSPACE}/install/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
    # --------------------------------------------------
    # Cache ROS workspace (build / install / log)
    # --------------------------------------------------
    - name: Cache ROS 2 workspace
      uses: actions/cache@v4
      id: cache-ros
      with:
        path: |
          ${GITHUB_WORKSPACE}/build
          ${GITHUB_WORKSPACE}/install
          ${GITHUB_WORKSPACE}/log
        key: ${{ runner.os }}-ros2-humble-${{ github.ref }}
        restore-keys: |
          ${{ runner.os }}-ros2-humble-
    # --------------------------------------------------
    # Build
    # --------------------------------------------------
    - name: Build octomap first
      shell: bash
      run: |
        export MY_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/cmake/toolchain.cmake"
        export CMAKE_TOOLCHAIN_FILE="${MY_TOOLCHAIN_FILE}"
        export CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/install:$CMAKE_PREFIX_PATH"

        colcon build \
          --symlink-install \
          --packages-select octomap-distribution \
          --cmake-args \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${MY_TOOLCHAIN_FILE}

    - name: Build full ROS 2 workspace
      shell: bash
      continue-on-error: true
      run: |
        export MY_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/cmake/toolchain.cmake"
        export CMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/install:$CMAKE_PREFIX_PATH"

        colcon build \
          --symlink-install \
          --executor parallel \
          --continue-on-error \
          --packages-ignore qt_gui_cpp rqt_gui_cpp nav2_system_tests \
          --cmake-args \
            -DCMAKE_BUILD_TYPE=Release \
            -DBOOST_ROOT=${GITHUB_WORKSPACE}/ros-commondep/boost-1.89 \
            -DBOOST_INCLUDEDIR=${GITHUB_WORKSPACE}/ros-commondep/boost-1.89/include \
            -DBOOST_LIBRARYDIR=${GITHUB_WORKSPACE}/ros-commondep/boost-1.89/lib \
            -DCMAKE_TOOLCHAIN_FILE=${MY_TOOLCHAIN_FILE}

    - name: Save ROS workspace cache
      uses: actions/cache@v4
      with:
        path: |
          ${GITHUB_WORKSPACE}/build
          ${GITHUB_WORKSPACE}/install
          ${GITHUB_WORKSPACE}/log
        key: ${{ runner.os }}-ros2-humble-${{ github.ref }}
    # --------------------------------------------------
    # Sanity check
    # --------------------------------------------------
    - name: Source workspace & sanity check
      shell: bash
      run: |
        source install/setup.bash
        ros2 --help
        timeout 5s ros2 run demo_nodes_cpp talker --ros-args --log-level info || true