name: macOS ROS 2 Humble CI (Apple Silicon)

on:
  push:
    branches: [humble]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      CI_BUILD: TRUE
      Python3_FIND_FRAMEWORK: NEVER
      Python3_FIND_STRATEGY: LOCATION
      CMAKE_FIND_FRAMEWORK: NEVER
    timeout-minutes: 360

    steps:
    # --------------------------------------------------
    # Checkout repository
    # --------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 0

    - name: Cache git submodules
      uses: actions/cache@v4
      with:
        path: .git/modules
        key: ${{ runner.os }}-git-submodules-${{ github.ref }}
        restore-keys: |
          ${{ runner.os }}-git-submodules-

    - name: Update submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive --jobs 8

    - name: Sync submodule branches
      run: |
        chmod +x scripts/sync-submodules-branches.sh
        ./scripts/sync-submodules-branches.sh

    # --------------------------------------------------
    # Homebrew cache
    # --------------------------------------------------
    - name: Cache Homebrew directories
      uses: actions/cache@v4
      id: cache-brew
      with:
        path: /opt/homebrew
        key: ${{ runner.os }}-brew-v2-${{ hashFiles('brew-packages/install_brew_packages.sh') }}
        restore-keys: |
          ${{ runner.os }}-brew-v2-

    - name: Configure Homebrew parallelism
      run: |
        echo "HOMEBREW_MAKE_JOBS=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV
        echo "HOMEBREW_CMAKE_BUILD_PARALLEL_LEVEL=$(sysctl -n hw.ncpu)" >> $GITHUB_ENV

    # --------------------------------------------------
    # Homebrew install
    # --------------------------------------------------
    - name: Update Homebrew and install base packages
      if: steps.cache-brew.outputs.cache-hit != 'true'
      run: |
        brew tap osrf/simulation
        brew install \
          python@3.10 \
          graphviz \
          eigen@3 \
          GeographicLib

    - name: Install Homebrew packages via script
      if: steps.cache-brew.outputs.cache-hit != 'true'
      run: |
        chmod +x brew-packages/install_brew_packages.sh
        ./brew-packages/install_brew_packages.sh

    # --------------------------------------------------
    # Force python3 -> Homebrew Python 3.10 (shim)
    # --------------------------------------------------
    - name: Force python3 alias to Homebrew Python 3.10
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/python-shim

        ln -sf /opt/homebrew/opt/python@3.10/bin/python3.10 \
               ${GITHUB_WORKSPACE}/python-shim/python3

        echo "${GITHUB_WORKSPACE}/python-shim" >> $GITHUB_PATH

        which python3
        python3 --version

    # --------------------------------------------------
    # Export Python env for colcon & CMake
    # --------------------------------------------------
    - name: Export Python env for colcon & CMake
      run: |
        PY=/opt/homebrew/opt/python@3.10/bin/python3.10

        echo "Python_EXECUTABLE=$PY" >> $GITHUB_ENV
        echo "Python3_EXECUTABLE=$PY" >> $GITHUB_ENV
        echo "COLCON_PYTHON_EXECUTABLE=$PY" >> $GITHUB_ENV
        echo "AMENT_PYTHON_EXECUTABLE=$PY" >> $GITHUB_ENV

        echo "Python_FIND_FRAMEWORK=NEVER" >> $GITHUB_ENV
        echo "Python3_FIND_FRAMEWORK=NEVER" >> $GITHUB_ENV

    # --------------------------------------------------
    # Python dependencies (Homebrew Python 3.10)
    # --------------------------------------------------
    - name: Install Python dependencies
      run: |
        /opt/homebrew/opt/python@3.10/bin/python3.10 -m pip install --upgrade pip
        /opt/homebrew/opt/python@3.10/bin/python3.10 -m pip install -U \
          --config-settings="--global-option=build_ext" \
          --config-settings="--global-option=-I$(brew --prefix graphviz)/include/" \
          --config-settings="--global-option=-L$(brew --prefix graphviz)/lib/" \
          argcomplete catkin_pkg colcon-common-extensions coverage \
          cryptography empy==3.3.4 flake8 flake8-blind-except==0.1.1 \
          flake8-builtins flake8-class-newline flake8-comprehensions \
          flake8-deprecated flake8-docstrings flake8-import-order \
          flake8-quotes importlib-metadata lark==1.1.1 lxml \
          matplotlib mock mypy==0.931 netifaces nose pep8 psutil \
          pydocstyle pydot pygraphviz pyparsing==2.4.7 \
          pytest-mock rosdep rosdistro setuptools==59.6.0 \
          vcstool typeguard jinja2

    # --------------------------------------------------
    # Backup: install catkin_pkg into framework Python
    # --------------------------------------------------
    - name: Install catkin_pkg into framework Python (fallback)
      run: |
        FW_PY=/Library/Frameworks/Python.framework/Versions/3.11/bin/python3

        if [ -x "$FW_PY" ]; then
          echo "Installing catkin_pkg into framework Python"
          $FW_PY -m pip install --user catkin_pkg
        else
          echo "Framework Python not found, skipping"
        fi

    # --------------------------------------------------
    # Setup environment variables
    # --------------------------------------------------
    - name: Setup build environment
      run: |
        QT_ROOT=$(brew --prefix qt@5)
        echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> $GITHUB_ENV
        echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
        echo "CMAKE_PREFIX_PATH=${GITHUB_WORKSPACE}/install:${QT_ROOT}" >> $GITHUB_ENV
        echo "DYLD_LIBRARY_PATH=${GITHUB_WORKSPACE}/install/lib" >> $GITHUB_ENV
        echo "GZ_VERSION=harmonic" >> $GITHUB_ENV
        echo "GZ_SIM_SYSTEM_PLUGIN_PATH=${GITHUB_WORKSPACE}/install/gz_ros2_control/lib" >> $GITHUB_ENV
        echo "DYLD_LIBRARY_PATH=${GITHUB_WORKSPACE}/install/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV

    # --------------------------------------------------
    # Cache ROS workspace
    # --------------------------------------------------
    - name: Cache ROS workspace
      uses: actions/cache@v4
      with:
        path: |
          build
          install
          log
        key: ${{ runner.os }}-ros2-humble-${{ github.ref }}
        restore-keys: |
          ${{ runner.os }}-ros2-humble-

    # --------------------------------------------------
    # Build octomap first
    # --------------------------------------------------
    - name: Build octomap first
      shell: bash
      run: |
        export CMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/cmake/toolchain.cmake"

        colcon build \
          --symlink-install \
          --packages-select octomap-distribution \
          --cmake-args \
            -DPython_EXECUTABLE=${Python_EXECUTABLE} \
            -DPython3_EXECUTABLE=${Python3_EXECUTABLE} \
            -DPython3_FIND_FRAMEWORK=NEVER \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TOOLCHAIN_FILE}

    # --------------------------------------------------
    # Build full workspace
    # --------------------------------------------------
    - name: Build full workspace
      shell: bash
      continue-on-error: true
      run: |
        export CMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/cmake/toolchain.cmake"

        colcon build \
          --symlink-install \
          --executor parallel \
          --cmake-clean-cache \
          --continue-on-error \
          --packages-ignore qt_gui_cpp rqt_gui_cpp nav2_system_tests octomap-distribution \
          --cmake-args \
            -DPython_EXECUTABLE=${Python_EXECUTABLE} \
            -DPython3_EXECUTABLE=${Python3_EXECUTABLE} \
            -DPython3_FIND_FRAMEWORK=NEVER \
            -DCMAKE_BUILD_TYPE=Release \
            -DBOOST_ROOT=${GITHUB_WORKSPACE}/ros-commondep/boost-1.89 \
            -DBOOST_INCLUDEDIR=${GITHUB_WORKSPACE}/ros-commondep/boost-1.89/include \
            -DBOOST_LIBRARYDIR=${GITHUB_WORKSPACE}/ros-commondep/boost-1.89/lib \
            -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TOOLCHAIN_FILE}

    # --------------------------------------------------
    # Sanity check
    # --------------------------------------------------
    - name: Source workspace & sanity check
      shell: bash
      continue-on-error: true
      run: |
        source install/setup.bash
        ros2 --help
        timeout 5s ros2 run demo_nodes_cpp talker || true
