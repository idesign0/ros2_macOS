name: macOS ROS 2 Humble CI (Apple Silicon)

on:
  push:
    branches: [humble]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 360  # increase to handle full ROS 2 build

    steps:
    # --------------------------------------------------
    # Checkout
    # --------------------------------------------------
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4

    - name: Cache all submodules
      uses: actions/cache@v4
      with:
        path: |
          ros2/**/*
          ros-planning/**/*
          moveit/**/*
          gazebo-release/**/*
          ros-visualization/**/*
          ros-drivers/**/*
          ros-perception/**/*
          ros-commondep/**/*
          ros2_macos_sdk/**/*
          eclipse-iceoryx/**/*
          eclipse-cyclonedds/**/*
          gzsim/**/*
        key: ${{ runner.os }}-ros2-submodules-${{ hashFiles('.gitmodules') }}
        restore-keys: |
          ${{ runner.os }}-ros2-submodules-

    - name: Sync submodules branches
      run: |
        chmod +x scripts/sync-submodules-branches.sh
        ./scripts/sync-submodules-branches.sh

    # --------------------------------------------------
    # Homebrew
    # --------------------------------------------------
    - name: Update Homebrew
      run: brew update

    - name: Install Homebrew packages
      run: |
        chmod +x brew-packages/install_brew_packages.sh
        ./brew-packages/install_brew_packages.sh

    # --------------------------------------------------
    # Python 3.11
    # --------------------------------------------------
    - name: Verify Python 3.11
      run: |
        export PATH="/Library/Frameworks/Python.framework/Versions/3.11/bin:$PATH"
        which python3
        python3 --version

    - name: Upgrade pip
      run: python3 -m pip install --upgrade pip

    - name: Install Python dependencies
      run: |
        python3 -m pip install -U \
          --config-settings="--global-option=build_ext" \
          --config-settings="--global-option=-I$(brew --prefix graphviz)/include/" \
          --config-settings="--global-option=-L$(brew --prefix graphviz)/lib/" \
          argcomplete catkin_pkg colcon-common-extensions coverage \
          cryptography empy==3.3.4 flake8 flake8-blind-except==0.1.1 flake8-builtins \
          flake8-class-newline flake8-comprehensions flake8-deprecated \
          flake8-docstrings flake8-import-order flake8-quotes \
          importlib-metadata lark==1.1.1 lxml matplotlib mock mypy==0.931 netifaces \
          nose pep8 psutil pydocstyle pydot pygraphviz pyparsing==2.4.7 \
          pytest-mock rosdep rosdistro setuptools==59.6.0 vcstool typeguard

    # --------------------------------------------------
    # Environment
    # --------------------------------------------------
    - name: Setup build environment
      run: |
        echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> $GITHUB_ENV
        echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
        echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5)" >> $GITHUB_ENV
        echo "GZ_VERSION=harmonic" >> $GITHUB_ENV
        echo "GZ_SIM_SYSTEM_PLUGIN_PATH=${GITHUB_WORKSPACE}/install/gz_ros2_control/lib/" >> $GITHUB_ENV
        echo "DYLD_LIBRARY_PATH=${GITHUB_WORKSPACE}/install/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV

    # --------------------------------------------------
    # Build (FULL, using toolchain.cmake)
    # --------------------------------------------------
    - name: Build full ROS 2 workspace (toolchain)
      shell: bash
      run: |
        set -e
        export CMAKE_BUILD_PARALLEL_LEVEL=4
        export MAKEFLAGS="-j4"
        export MY_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/cmake/toolchain.cmake"

        colcon build \
          --symlink-install \
          --executor parallel \
          --parallel-workers 4 \
          --packages-ignore \
            qt_gui_cpp \
            rqt_gui_cpp \
            nav2_system_tests \
          --cmake-args \
            -DCMAKE_TOOLCHAIN_FILE=${MY_TOOLCHAIN_FILE} \
            -DCMAKE_BUILD_TYPE=Release \
          --event-handlers console_direct+ \
          --continue-on-error

    # --------------------------------------------------
    # Post-build sanity check
    # --------------------------------------------------
    - name: Source workspace & sanity check
      shell: bash
      run: |
        source install/setup.bash
        ros2 --help
        # Optional: minimal node run
        ros2 run demo_nodes_cpp talker --ros-args --log-level info
