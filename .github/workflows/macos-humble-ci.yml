name: macOS ROS 2 Humble CI (Apple Silicon)

on:
  push:
    branches: [humble]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      CI_BUILD: TRUE
    timeout-minutes: 360

    steps:
    # --------------------------------------------------
    # Checkout (NO submodules here)
    # --------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: false
        fetch-depth: 0

    # --------------------------------------------------
    # Cache git submodule objects ONLY
    # --------------------------------------------------
    - name: Cache git submodules
      uses: actions/cache@v4
      with:
        path: .git/modules
        key: ${{ runner.os }}-git-submodules-${{ github.ref }}
        restore-keys: |
          ${{ runner.os }}-git-submodules-

    # --------------------------------------------------
    # Init & update submodules (FAST after first run)
    # --------------------------------------------------
    - name: Update submodules
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive --jobs 8

    - name: Sync submodule branches
      run: |
        chmod +x scripts/sync-submodules-branches.sh
        ./scripts/sync-submodules-branches.sh

    # --------------------------------------------------
    # Homebrew Caching/Installation
    # --------------------------------------------------
    - name: Cache Homebrew directories
      uses: actions/cache@v4
      id: cache-brew
      with:
        path: /opt/homebrew
        # Key based on OS, version, and hash of your installation script
        key: ${{ runner.os }}-brew-v1-${{ hashFiles('brew-packages/install_brew_packages.sh') }}
        restore-keys: |
          ${{ runner.os }}-brew-v1-

    # Homebrew: Conditional Install (runs only on cache miss)
    - name: Update Homebrew and Install Base Packages
      if: steps.cache-brew.outputs.cache-hit != 'true'
      run: |
        brew update
        # Install taps and base packages required before the main install script runs
        brew tap osrf/simulation
        brew install graphviz eigen@3

    - name: Install Homebrew packages via script
      if: steps.cache-brew.outputs.cache-hit != 'true'
      run: |
        chmod +x brew-packages/install_brew_packages.sh
        ./brew-packages/install_brew_packages.sh

    # --------------------------------------------------
    # Homebrew: Set PATH (ALWAYS run)
    # --------------------------------------------------
    # Ensure /opt/homebrew/bin is in the PATH for all subsequent steps, regardless of cache hit/miss.
    - name: Set Homebrew PATH
      run: |
        echo "/opt/homebrew/bin" >> $GITHUB_PATH
        # The 'Use Cached Homebrew' step is now redundant and removed.
    
    # --------------------------------------------------
    # Homebrew: Unlink packages (ALWAYS run)
    # --------------------------------------------------
    - name: Unlink unwanted Homebrew packages
      run: |
        set +e
        echo "Unlinking Homebrew packages to avoid accidental usage..."
        brew unlink boost || true
        brew unlink boost-python3 || true
        brew unlink xtensor || true
        brew unlink xdm || true
        brew unlink xtl || true
        brew unlink qt || true
        echo "Homebrew unlink step completed."

    # --------------------------------------------------
    # Python 3.11 Setup (SYSTEM Python, NOT Homebrew)
    # --------------------------------------------------
    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      id: setup-python
      with:
        python-version: "3.11"
        # Use built-in pip cache
        cache: 'pip' 

    # --------------------------------------------------
    # Cache Python Virtual Environment
    # --------------------------------------------------
    - name: Cache Python Venv and Dependencies
      uses: actions/cache@v4
      id: cache-venv
      with:
        path: venv
        # Key based on OS, Python version, and hash of the dependency definitions.
        # If your 'pip install' command changes, this cache will miss.
        key: ${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-deps-v1-${{ hashFiles('brew-packages/install_brew_packages.sh') }}
        restore-keys: |
          ${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-deps-v1-

    # --------------------------------------------------
    # Python Virtual Environment: Conditional Setup
    # --------------------------------------------------
    - name: Setup and Install Python virtual environment
      run: |
        # Use the 'venv' directory for a local, cacheable virtual environment
        VENV_DIR="${GITHUB_WORKSPACE}/venv"
        
        # Condition to check if cache was a miss
        if [ "${{ steps.cache-venv.outputs.cache-hit }}" != "true" ]; then
          echo "Python Venv cache missed. Installing dependencies..."
          python3 -m venv "$VENV_DIR"
          source "$VENV_DIR/bin/activate"
          
          python3 -m pip install --upgrade pip
          
          # The entire massive pip install command runs ONLY on a cache miss
          python3 -m pip install -U \
            --config-settings="--global-option=build_ext" \
            --config-settings="--global-option=-I$(brew --prefix graphviz)/include/" \
            --config-settings="--global-option=-L$(brew --prefix graphviz)/lib/" \
            argcomplete catkin_pkg colcon-common-extensions coverage \
            cryptography empy==3.3.4 flake8 flake8-blind-except==0.1.1 \
            flake8-builtins flake8-class-newline flake8-comprehensions \
            flake8-deprecated flake8-docstrings flake8-import-order \
            flake8-quotes importlib-metadata lark==1.1.1 lxml \
            matplotlib mock mypy==0.931 netifaces nose pep8 psutil \
            pydocstyle pydot pygraphviz pyparsing==2.4.7 \
            pytest-mock rosdep rosdistro setuptools==59.6.0 \
            vcstool typeguard
        else
          echo "Python Venv cache hit. Activating existing venv."
        fi
        
        # ALWAYS activate the venv and add its bin directory to PATH for all subsequent steps
        source "$VENV_DIR/bin/activate"
        echo "$VENV_DIR/bin" >> $GITHUB_PATH

    # --------------------------------------------------
    # Environment
    # --------------------------------------------------
    - name: Setup build environment
      run: |
        echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> $GITHUB_ENV
        echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
        echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5):$(brew --prefix eigen@3)/share/eigen3/cmake" >> $GITHUB_ENV
        echo "GZ_VERSION=harmonic" >> $GITHUB_ENV
        echo "GZ_SIM_SYSTEM_PLUGIN_PATH=${GITHUB_WORKSPACE}/install/gz_ros2_control/lib" >> $GITHUB_ENV
        echo "DYLD_LIBRARY_PATH=${GITHUB_WORKSPACE}/install/lib:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "EIGEN3_INCLUDE_DIR=$(brew --prefix eigen@3)/include/eigen3" >> $GITHUB_ENV
        echo "EIGEN_INCLUDE_DIR=$(brew --prefix eigen@3)/include/eigen3" >> $GITHUB_ENV
        echo "CPPFLAGS=-I$(brew --prefix eigen@3)/include $CPPFLAGS" >> $GITHUB_ENV

    # --------------------------------------------------
    # Build
    # --------------------------------------------------
    - name: Build full ROS 2 workspace
      shell: bash
      run: |
        set -e
        source "$GITHUB_WORKSPACE/venv/bin/activate" # Ensure venv is active for colcon
        export MY_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/cmake/toolchain.cmake"

        colcon build \
          --symlink-install \
          --executor parallel \
          --packages-ignore qt_gui_cpp rqt_gui_cpp nav2_system_tests \
          --cmake-args \
            -DCMAKE_BUILD_TYPE=Release \
            -DBOOST_ROOT=${GITHUB_WORKSPACE}/ros-commondep/boost-1.89 \
            -DBOOST_INCLUDEDIR=${GITHUB_WORKSPACE}/ros-commondep/boost-1.89/include \
            -DBOOST_LIBRARYDIR=${GITHUB_WORKSPACE}/ros-commondep/boost-1.89/lib \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DCMAKE_TOOLCHAIN_FILE=${MY_TOOLCHAIN_FILE} \
          --continue-on-error

    # --------------------------------------------------
    # Sanity check
    # --------------------------------------------------
    - name: Source workspace & sanity check
      shell: bash
      run: |
        source install/setup.bash
        ros2 --help
        ros2 run demo_nodes_cpp talker --ros-args --log-level info