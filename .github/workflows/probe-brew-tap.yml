name: Probe brew tap layout (diagnostic)

# Throwaway diagnostic for the tap-layout problem.
#
# Established so far: runner image 20261026.0455.2 ships homebrew-core AS A GIT CHECKOUT and
# our pin works; image 20261102.0473.1 does not, and on it the pin step warns
# "homebrew-core is not a git tap" and the run proceeds unpinned (jazzy gz, run 42019...).
# A first 5-runner sample drew the old image 5/5, so the remedy was never exercised.
#
# This version does not wait for luck: it SIMULATES the new layout by moving .git aside on
# whatever runner it gets, then tests the candidate remedies in that state. It also reports
# the image version each time, so repeated runs measure the rollout.

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5]
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Probe
        shell: bash
        run: |
          set -uo pipefail
          PIN=4392eb17026de31d12a17bdf6b17b753f767d198
          CORE="$(brew --repo homebrew/core)"
          CASK="$(brew --repo homebrew/cask)"
          say() { echo; echo "### $*"; }
          state() { echo "     .git=$([ -e "$1/.git" ] && echo yes || echo no) HEAD=$(git -C "$1" rev-parse --short HEAD 2>/dev/null || echo n/a) rb=$(find "$1" -name '*.rb' -maxdepth 3 2>/dev/null | wc -l | tr -d ' ')"; }
          probe_resolve() {   # $1 = label
            local f c s j
            f=$(HOMEBREW_NO_INSTALL_FROM_API=1 brew info --formula graphviz >/dev/null 2>&1 && echo OK || echo FAIL)
            c=$(HOMEBREW_NO_INSTALL_FROM_API=1 brew info --cask serial   >/dev/null 2>&1 && echo OK || echo FAIL)
            s=$(HOMEBREW_NO_INSTALL_FROM_API=1 brew info serial          >/dev/null 2>&1 && echo OK || echo FAIL)
            j=$(HOMEBREW_NO_INSTALL_FROM_API=1 brew info --json=v2 openssl@3 2>/dev/null | jq -r '.formulae[0].versions.stable' 2>/dev/null || echo FAIL)
            echo "     $1: formula=$f cask=$c bare-serial=$s openssl@3=$j"
          }

          say "0. identity  (IMAGE is the thing to collect across runs)"
          echo "  IMAGE=${ImageVersion:-unknown}  OS=${ImageOS:-unknown}  macOS=$(sw_vers -productVersion)"
          echo "  brew=$(brew --version | head -1)"
          echo "  core=$CORE"
          echo "  cask=$CASK"

          say "1. layout as shipped"
          echo "  core:"; state "$CORE"
          echo "  cask:"; state "$CASK"
          NATIVE=$([ -e "$CORE/.git" ] && echo git || echo plain)
          echo "  NATIVE_LAYOUT=$NATIVE"
          probe_resolve "as-shipped"

          say "2. simulate the new layout (move .git aside)"
          if [ "$NATIVE" = git ]; then
            sudo mv "$CORE/.git" "$CORE/.git.bak" 2>/dev/null || mv "$CORE/.git" "$CORE/.git.bak"
            [ -e "$CASK/.git" ] && { sudo mv "$CASK/.git" "$CASK/.git.bak" 2>/dev/null || mv "$CASK/.git" "$CASK/.git.bak"; }
            echo "  moved .git aside on core and cask"
          else
            echo "  runner is ALREADY plain -- testing the real thing, no simulation needed"
          fi
          echo "  core:"; state "$CORE"
          probe_resolve "plain-layout"
          echo "  ^ compare with as-shipped: this is what jazzy gz actually faced"

          say "3. REMEDY A: git init + fetch + reset --hard, in place"
          (
            git -C "$CORE" init -q
            git -C "$CORE" remote remove origin 2>/dev/null || true
            git -C "$CORE" remote add origin https://github.com/Homebrew/homebrew-core.git
            if git -C "$CORE" fetch --depth=1 --no-tags origin "$PIN" 2>&1 | tail -2; then
              echo "  fetch OK"
            else
              echo "  fetch FAILED"
            fi
            # checkout --detach refuses to clobber the 8679 untracked files already there;
            # reset --hard is the form that can. Try the gentle one first and report.
            if git -C "$CORE" checkout -q --detach FETCH_HEAD 2>&1 | tail -2; then
              echo "  checkout --detach: OK"
            else
              echo "  checkout --detach: FAILED (expected: untracked files would be overwritten)"
              if git -C "$CORE" reset --hard -q FETCH_HEAD 2>&1 | tail -2; then
                echo "  reset --hard: OK"
              else
                echo "  reset --hard: FAILED"
              fi
            fi
          ) 2>&1 | sed 's/^/   /'
          echo "  core after remedy A:"; state "$CORE"
          echo "  HEAD == PIN ? $([ "$(git -C "$CORE" rev-parse HEAD 2>/dev/null)" = "$PIN" ] && echo YES || echo NO)"
          probe_resolve "after-remedy-A"
          echo "  (openssl@3 should read 3.5.9 if the pin truly took effect)"

          say "4. does a normal install still work after remedy A?"
          HOMEBREW_NO_INSTALL_FROM_API=1 HOMEBREW_NO_AUTO_UPDATE=1 \
            brew install --formula libmodbus > /tmp/inst.log 2>&1 \
            && echo "  brew install libmodbus: OK" \
            || { echo "  brew install libmodbus: FAILED"; tail -8 /tmp/inst.log | sed 's/^/     /'; }

          say "5. verdict"
          echo "  IMAGE=${ImageVersion:-unknown} NATIVE_LAYOUT=$NATIVE REMEDY_A_PINNED=$([ "$(git -C "$CORE" rev-parse HEAD 2>/dev/null)" = "$PIN" ] && echo YES || echo NO)"
