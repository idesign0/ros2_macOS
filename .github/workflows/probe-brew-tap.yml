name: Probe brew tap layout (diagnostic)

# Throwaway diagnostic. Answers, with evidence rather than inference:
#   1. is homebrew-core a git checkout on this runner, or a plain directory?
#   2. how is the pool split between the two layouts? (matrix of 5 = our macOS concurrency cap,
#      so all five land on different runners at the same instant)
#   3. can pinning be RESTORED in place on a plain-directory runner?
#   4. why does formula resolution work there while cask resolution fails?
#   5. is HOMEBREW_NO_INSTALL_FROM_API=1 still doing more good than harm?
# Costs ~3 min per job and builds nothing.

on:
  workflow_dispatch:
    inputs:
      samples:
        description: "How many runners to sample (1-5)"
        required: false
        default: "5"
        type: choice
        options: ["1", "3", "5"]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5]
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Probe
        shell: bash
        run: |
          set -uo pipefail
          PIN=4392eb17026de31d12a17bdf6b17b753f767d198
          CORE=/opt/homebrew/Library/Taps/homebrew/homebrew-core
          CASK=/opt/homebrew/Library/Taps/homebrew/homebrew-cask
          say() { echo "### $*"; }

          say "0. identity"
          echo "  runner image : ${ImageVersion:-unknown} / ${ImageOS:-unknown}"
          echo "  arch         : $(uname -m)   macOS $(sw_vers -productVersion)"
          echo "  brew         : $(brew --version | head -1)"
          echo "  brew prefix  : $(brew --prefix)"

          say "1. tap layout"
          for d in "$CORE" "$CASK"; do
            if [ -d "$d" ]; then
              echo "  $d"
              echo "     .git            : $([ -e "$d/.git" ] && echo PRESENT || echo ABSENT)"
              echo "     Formula/ or Casks/: $([ -d "$d/Formula" ] && echo "Formula ($(find "$d/Formula" -name '*.rb' 2>/dev/null | wc -l | tr -d ' ') rb)" || true)$([ -d "$d/Casks" ] && echo "Casks ($(find "$d/Casks" -name '*.rb' 2>/dev/null | wc -l | tr -d ' ') rb)" || true)"
              echo "     entries         : $(ls -1 "$d" 2>/dev/null | head -6 | tr '\n' ' ')"
              echo "     HEAD            : $(git -C "$d" rev-parse --short HEAD 2>/dev/null || echo 'n/a (not a git repo)')"
            else
              echo "  $d : DOES NOT EXIST"
            fi
          done
          echo "  brew tap list: $(brew tap 2>/dev/null | tr '\n' ' ')"
          echo "  HOMEBREW_NO_INSTALL_FROM_API in env: ${HOMEBREW_NO_INSTALL_FROM_API:-<unset>}"
          echo "  json api cache: $(ls -1 ~/Library/Caches/Homebrew/api 2>/dev/null | tr '\n' ' ')"

          say "2. resolution: formula vs cask, API on vs off"
          for mode in api-on api-off; do
            if [ "$mode" = api-off ]; then export HOMEBREW_NO_INSTALL_FROM_API=1; else unset HOMEBREW_NO_INSTALL_FROM_API; fi
            f=$(brew info --formula graphviz >/dev/null 2>&1 && echo OK || echo FAIL)
            c=$(brew info --cask serial >/dev/null 2>&1 && echo OK || echo FAIL)
            s=$(brew info serial >/dev/null 2>&1 && echo OK || echo FAIL)
            j=$(brew info --json=v2 openssl@3 2>/dev/null | jq -r '.formulae[0].versions.stable' 2>/dev/null || echo FAIL)
            echo "  $mode: formula=$f  cask(explicit)=$c  bare 'serial'=$s  json openssl@3=$j"
          done
          unset HOMEBREW_NO_INSTALL_FROM_API

          say "3. CAN PINNING BE RESTORED IN PLACE?"
          if [ -e "$CORE/.git" ]; then
            echo "  already a git tap -- pin works as designed here"
            echo "  current HEAD: $(git -C "$CORE" rev-parse --short HEAD)"
          else
            echo "  attempt A: git init + remote + fetch + detach, in place"
            (
              set -x
              git -C "$CORE" init -q 2>&1 | tail -2
              git -C "$CORE" remote add origin https://github.com/Homebrew/homebrew-core.git 2>&1 | tail -2
              git -C "$CORE" fetch --depth=1 --no-tags origin "$PIN" 2>&1 | tail -3
              git -C "$CORE" checkout -q --detach FETCH_HEAD 2>&1 | tail -3
            ) 2>&1 | sed 's/^/     /'
            echo "  after attempt A: .git=$([ -e "$CORE/.git" ] && echo PRESENT || echo ABSENT) HEAD=$(git -C "$CORE" rev-parse --short HEAD 2>/dev/null || echo n/a)"
            echo "  Formula count now: $(find "$CORE/Formula" -name '*.rb' 2>/dev/null | wc -l | tr -d ' ')"
            echo "  does brew still work? $(HOMEBREW_NO_INSTALL_FROM_API=1 brew info --formula graphviz >/dev/null 2>&1 && echo YES || echo NO)"
            echo "  is openssl@3 the pinned version? $(HOMEBREW_NO_INSTALL_FROM_API=1 brew info --json=v2 openssl@3 2>/dev/null | jq -r '.formulae[0].versions.stable' 2>/dev/null)"
          fi

          say "4. what the image preinstalled"
          echo "  installed formulae: $(brew list --formula 2>/dev/null | wc -l | tr -d ' ')"
          echo "  openssl@3: $(brew list --versions openssl@3 2>/dev/null || echo absent)"
          echo "  ca-certificates: $(brew list --versions ca-certificates 2>/dev/null || echo absent)"
          echo "  multi-keg formulae: $(brew list --formula --versions 2>/dev/null | awk 'NF>2' | wc -l | tr -d ' ')"

          say "5. verdict"
          echo "  LAYOUT=$([ -e "$CORE/.git" ] && echo git || echo plain)  IMAGE=${ImageVersion:-unknown}"
