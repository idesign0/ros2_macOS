# ------------------------------------------------------------------
# Update forked submodules from upstream (all distros)
#
# THIS FILE LIVES ON THE DEFAULT BRANCH ON PURPOSE.
#   GitHub only fires `schedule` from the default branch, and only lists workflows
#   present on it for workflow_dispatch. A copy on humble-new/jazzy-new/kilted-new
#   would never run. Each matrix leg therefore checks out its own distro branch and
#   runs the scripts from THAT checkout, so the code here stays generic.
#
# WHY IT IS A SEPARATE WORKFLOW AND NOT PART OF THE BUILD
#   update_forked_submodules.sh used to be called from .github/actions/setup-ros2-macos,
#   i.e. from every job of every build, where it could never work: it needs an `upstream`
#   git remote, that remote lives in the uncommitted .git/modules/<path>/config, and CI
#   clones submodules fresh with only `origin`. Every build logged
#   "Skipped (648) -- no upstream remote".
#   It must not go back there either. That action has 4 call sites and a kilted run has
#   ~27 jobs, so a working updater would rebase and force-push each fork up to 27 times
#   per run, concurrently, across three distros. Jobs early and late in one run would
#   then build DIFFERENT fork commits, which makes a build failure impossible to
#   attribute to a commit.
#
# SAFETY
#   - max-parallel: 1 plus a single concurrency group: never two legs force-pushing the
#     same fork branch at the same time.
#   - ci/fork-no-autoupdate.txt lists the pins. add_upstream_remotes.sh withholds and
#     actively removes their `upstream` remote, and update_forked_submodules.sh refuses
#     them by name too. A pin exists to stop tracking upstream; rebasing one would bring
#     back the failure it was created to avoid.
#   - Manual runs default to dry_run=true (nothing is pushed). The schedule pushes.
# ------------------------------------------------------------------
name: Update forked submodules

on:
  # Weekly, Sunday 03:00 UTC. The build days are staggered one distro per day during the
  # week, which leaves the weekend clear: a layered run started Friday is finished by
  # Saturday, so Sunday is the one window where nothing is reading the fork branches.
  #   scheduler.yml ALSO calls this (forks first, dispatch second) so a scheduled build
  #   still starts from forks that were just refreshed. Both entry points go through the
  #   `gate` job below, so neither can rebase a fork while a build is in flight.
  schedule:
    - cron: "0 3 * * 0"
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
      distro:
        type: string
        default: all
      force:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute rebases but push nothing (leave on for a first look)"
        type: boolean
        default: true
      distro:
        description: "Which distro to process"
        type: choice
        default: all
        options: [all, humble, jazzy, kilted]
      force:
        description: "Run even while a build is active (normally it stands down)"
        type: boolean
        default: false

concurrency:
  group: update-forked-submodules
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Never rewrite a fork branch while a build is reading it. A layered run takes 20-33h
  # and clones submodules fresh in every one of its ~27 jobs, so a rebase mid-run makes
  # the late shards build different fork commits than the early ones and a failure can no
  # longer be pinned to a commit. scheduler.yml carries the same check before it calls
  # this workflow; that path simply passes this one too.
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      active: ${{ steps.check.outputs.active }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.CATS_DEPLOY_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          total=0
          for d in humble jazzy kilted; do
            for st in in_progress queued; do
              for wf in "macos-${d}-ci.yml" "macos-${d}-layered.yml"; do
                n=$(gh run list --repo idesign0/ros2_macOS \
                      --workflow "$wf" --status "$st" \
                      --json databaseId --jq 'length' 2>/dev/null || echo 0)
                echo "  $wf $st: $n"
                total=$((total + n))
              done
            done
          done
          echo "active=$total" >> "$GITHUB_OUTPUT"
          if [ "$total" -gt 0 ] && [ "$FORCE" != "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$total build(s) in progress or queued -- standing down so the running build keeps a consistent set of fork commits. Re-run with force=true to override."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  # The matrix is built here because `matrix` is NOT available in a job-level `if`
  # (that expression is evaluated before the matrix expands, and GitHub rejects the
  # whole file with "Unrecognized named-value: 'matrix'"). Filtering the matrix itself
  # is the supported way to run a subset.
  plan:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          DISTRO: ${{ inputs.distro || 'all' }}
        run: |
          # Every superproject branch is covered, main AND -new, because each has its own
          # .gitmodules and therefore its own set of forks and fork branches. Updating only
          # one set would leave the other building stale forks -- which is how this started:
          # id_rmw never picked up upstream and the main branches failed on it.
          h='{"distro":"humble","ref":"humble"},{"distro":"humble","ref":"humble-new"}'
          j='{"distro":"jazzy","ref":"jazzy"},{"distro":"jazzy","ref":"jazzy-new"}'
          k='{"distro":"kilted","ref":"kilted"},{"distro":"kilted","ref":"kilted-new"}'
          case "$DISTRO" in
            humble) m="{\"include\":[$h]}" ;;
            jazzy)  m="{\"include\":[$j]}" ;;
            kilted) m="{\"include\":[$k]}" ;;
            all|"") m="{\"include\":[$h,$j,$k]}" ;;
            *) echo "::error::unknown distro: $DISTRO"; exit 1 ;;
          esac
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "will process: $DISTRO"
          echo "$m"

  update:
    needs: plan
    # Plain git work; no macOS runner needed.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout ${{ matrix.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          token: ${{ secrets.CATS_DEPLOY_TOKEN }}

      - name: Authenticate git for fork pushes
        run: |
          git config --global user.name  "ros2-macos-ci"
          git config --global user.email "ros2-macos-ci@users.noreply.github.com"
          git config --global url."https://${{ secrets.CATS_DEPLOY_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Check out submodules
        run: |
          git submodule sync --recursive
          n=0
          until git submodule update --init --recursive --jobs 8; do
            n=$((n+1))
            if [ "$n" -ge 6 ]; then echo "::error::submodule update failed after $n attempts"; exit 1; fi
            echo "attempt $n failed (transient); retrying in $((n*20))s"
            git submodule sync --recursive || true
            sleep $((n*20))
          done

      - name: Put each submodule on its .gitmodules branch
        run: |
          chmod +x scripts/sync-submodules-branches.sh
          ./scripts/sync-submodules-branches.sh

      - name: Give forks their upstream remote
        run: |
          if [ ! -f scripts/add_upstream_remotes.sh ]; then
            echo "::error::scripts/add_upstream_remotes.sh missing on ${{ matrix.ref }}"
            exit 1
          fi
          chmod +x scripts/add_upstream_remotes.sh
          ./scripts/add_upstream_remotes.sh

      - name: Rebase forks onto upstream
        env:
          # Manual dispatch defaults to a dry run; the schedule (no inputs) pushes.
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          chmod +x scripts/update_forked_submodules.sh
          ./scripts/update_forked_submodules.sh 2>&1 | tee /tmp/fork-update.log

      - name: Summarize
        if: always()
        run: |
          {
            echo "### ${{ matrix.distro }} -- branch ${{ matrix.ref }}"
            echo
            echo "DRY_RUN=${{ inputs.dry_run && '1' || '0' }}"
            echo
            # Lead with the verdict so a run needing a human is obvious from the job list
            # without opening the log.
            if grep -q 'NEEDS MANUAL ATTENTION' /tmp/fork-update.log 2>/dev/null; then
              echo "**$(grep -c 'needs manual' /tmp/fork-update.log 2>/dev/null || echo '?') submodule(s) need manual attention** -- see the block below."
            else
              echo "No submodule needed manual attention."
            fi
            echo
            echo '```'
            # 1000, not 300: the summary used to run ~657 lines because the ~540
            # "no upstream remote" rows (submodules that are not forks at all) were
            # printed in full, and NEEDS MANUAL ATTENTION came last, at line 644 -- so
            # head -300 silently dropped the one section a human has to act on. The
            # script now prints MANUAL first and collapses that noise to a count, which
            # brings a realistic dry run to ~126 lines; the wider cap is headroom.
            sed -n '/SUMMARY/,$p' /tmp/fork-update.log 2>/dev/null | head -1000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
