name: macOS ROS 2 Humble — Layered Matrix (experimental)

# EXPERIMENTAL, dispatch-only. Runs alongside macos-humble-ci.yml (unchanged).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_BUILD: "TRUE"
  HOMEBREW_NO_INSTALL_FROM_API: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  GZ_VERSION: harmonic
  GZ_DIR: gz-harmonic
  BREW_BASE: "graphviz eigen@3 GeographicLib vtk"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      domains: ${{ steps.set.outputs.domains }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - id: set
        run: |
          echo "domains=$(jq -R -s -c 'split("\n") | map(select(length>0))' ci/shards/_domains.txt)" >> "$GITHUB_OUTPUT"

  base-1:
    needs: plan
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, fetch-depth: 0 }
      - uses: ./.github/actions/setup-ros2-macos
        with:
          deploy-token: ${{ secrets.CATS_DEPLOY_TOKEN }}
          gz-version: ${{ env.GZ_VERSION }}
          brew-base-formulae: ${{ env.BREW_BASE }}
      - name: Shard coverage diagnostics (non-fatal)
        run: |
          set +e
          colcon list --names-only 2>/dev/null | sort -u > /tmp/all_names.txt
          echo "unique package names: $(wc -l < /tmp/all_names.txt)"
          cat ci/shards/00_base_core.txt ci/shards/01_base_vendors.txt ci/shards/dom_*.txt ci/skip-list.txt \
            | grep -vE '^\s*#|^\s*$' | sort -u > /tmp/assigned.txt
          comm -23 /tmp/all_names.txt /tmp/assigned.txt > /tmp/unassigned.txt
          echo "not covered by any shard: $(wc -l < /tmp/unassigned.txt)"
          head -40 /tmp/unassigned.txt
          exit 0
      - name: Apply skip-list (COLCON_IGNORE)
        run: |
          grep -vE '^\s*#|^\s*$' ci/skip-list.txt | while read -r pkg; do
            path=$(colcon list --base-paths . 2>/dev/null | awk -F'\t' -v p="$pkg" '$1==p{print $2; exit}')
            [ -n "$path" ] && touch "$path/COLCON_IGNORE" && echo "ignore: $pkg" || true
          done
      - name: Build External Gazebo (protobuf + gz)
        run: |
          mkdir -p "$GZ_DIR"
          git clone --recurse-submodules https://github.com/idesign0/gz-macOS.git -b "$GZ_VERSION" "$GZ_DIR"
          brew unlink protobuf || true
          colcon build --packages-select protobuf --executor parallel --parallel-workers $(sysctl -n hw.ncpu) \
            --merge-install --continue-on-error --cmake-args -DBUILD_SHARED_LIBS=ON -Dprotobuf_BUILD_TESTS=OFF \
            -Dprotobuf_BUILD_CONFORMANCE=OFF -Dprotobuf_BUILD_EXAMPLES=OFF \
            -DCMAKE_TOOLCHAIN_FILE="${CMAKE_TOOLCHAIN_FILE}" -DCI_BUILD=TRUE \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache || true
          colcon build --base-paths "$GZ_DIR/" --packages-ignore protobuf --executor parallel --parallel-workers $(sysctl -n hw.ncpu) \
            --merge-install --continue-on-error --cmake-args -DCMAKE_TOOLCHAIN_FILE="${CMAKE_TOOLCHAIN_FILE}" -DCI_BUILD=TRUE \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache || true
          touch "$GZ_DIR/COLCON_IGNORE"
      - name: Unlink conflicting Homebrew packages
        run: |
          set +e
          brew unlink boost || true
          brew unlink boost-python3 || true
          brew unlink xtensor || true
          brew unlink xdm || true
          brew unlink xtl || true
          brew unlink qt || true
          brew unlink asio || true
          brew unlink orocos-kdl || true
          brew unlink ceres-solver || true
          brew unlink yaml-cpp || true
          echo "unlink done"
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-humble-base1-${{ github.run_id }}
          restore-keys: ccache-humble-base1-
      - name: Build base-1 (foundation)
        continue-on-error: true
        run: |
          SEL=$(grep -vE '^\s*#|^\s*$' ci/shards/base_1.txt | tr '\n' ' ')
          colcon build --packages-select $SEL \
            --merge-install --executor parallel --parallel-workers $(sysctl -n hw.ncpu) --continue-on-error \
            --cmake-args -DCMAKE_TOOLCHAIN_FILE="${CMAKE_TOOLCHAIN_FILE}" -DCI_BUILD=TRUE \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee build_base1.log
          echo "== summary =="; grep -E 'Summary:|packages failed' build_base1.log || true
      - name: Upload install-base1
        uses: actions/upload-artifact@v4
        with:
          name: install-base1
          path: install
          retention-days: 2
      - name: Summary base1
        if: always()
        run: |
          mkdir -p summaries
          { echo "## base1"; grep -E 'Failed +<<<' build_base1.log 2>/dev/null | sort -u || true; } > summaries/_base1.txt
      - name: Upload summary base1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-_base1
          path: summaries
          retention-days: 5
  base-2:
    needs: base-1
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, fetch-depth: 0 }
      - uses: ./.github/actions/setup-ros2-macos
        with:
          deploy-token: ${{ secrets.CATS_DEPLOY_TOKEN }}
          gz-version: ${{ env.GZ_VERSION }}
          brew-base-formulae: ${{ env.BREW_BASE }}
      - uses: actions/download-artifact@v4
        with: { name: install-base1, path: install }
      - name: Apply skip-list (COLCON_IGNORE)
        run: |
          grep -vE '^\s*#|^\s*$' ci/skip-list.txt | while read -r pkg; do
            path=$(colcon list --base-paths . 2>/dev/null | awk -F'\t' -v p="$pkg" '$1==p{print $2; exit}')
            [ -n "$path" ] && touch "$path/COLCON_IGNORE" && echo "ignore: $pkg" || true
          done
      - name: Unlink conflicting Homebrew packages
        run: |
          set +e
          brew unlink boost || true
          brew unlink boost-python3 || true
          brew unlink xtensor || true
          brew unlink xdm || true
          brew unlink xtl || true
          brew unlink qt || true
          brew unlink asio || true
          brew unlink orocos-kdl || true
          brew unlink ceres-solver || true
          brew unlink yaml-cpp || true
          echo "unlink done"
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-humble-base2-${{ github.run_id }}
          restore-keys: ccache-humble-base2-
      - name: Build base-2 (rest)
        continue-on-error: true
        run: |
          source install/setup.sh
          SEL=$(grep -vE '^\s*#|^\s*$' ci/shards/base_2.txt | tr '\n' ' ')
          colcon build --packages-select $SEL \
            --merge-install --executor parallel --parallel-workers $(sysctl -n hw.ncpu) --continue-on-error \
            --cmake-args -DCMAKE_TOOLCHAIN_FILE="${CMAKE_TOOLCHAIN_FILE}" -DCI_BUILD=TRUE \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee build_base2.log
          echo "== summary =="; grep -E 'Summary:|packages failed' build_base2.log || true
      - name: Upload install-base
        uses: actions/upload-artifact@v4
        with:
          name: install-base
          path: install
          retention-days: 2
      - name: Summary base2
        if: always()
        run: |
          mkdir -p summaries
          { echo "## base2"; grep -E 'Failed +<<<' build_base2.log 2>/dev/null | sort -u || true; } > summaries/_base2.txt
      - name: Upload summary base2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-_base2
          path: summaries
          retention-days: 5

  domains:
    needs: [plan, base-2]
    runs-on: macos-26
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.domains) }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false, fetch-depth: 0 }
      - uses: ./.github/actions/setup-ros2-macos
        with:
          deploy-token: ${{ secrets.CATS_DEPLOY_TOKEN }}
          gz-version: ${{ env.GZ_VERSION }}
          brew-base-formulae: ${{ env.BREW_BASE }}
      - uses: actions/download-artifact@v4
        with: { name: install-base, path: install }
      - name: Apply skip-list (COLCON_IGNORE)
        run: |
          grep -vE '^\s*#|^\s*$' ci/skip-list.txt | while read -r pkg; do
            path=$(colcon list --base-paths . 2>/dev/null | awk -F'\t' -v p="$pkg" '$1==p{print $2; exit}')
            [ -n "$path" ] && touch "$path/COLCON_IGNORE" && echo "ignore: $pkg" || true
          done
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-humble-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: ccache-humble-${{ matrix.shard }}-
      - name: Build shard ${{ matrix.shard }}
        continue-on-error: true
        run: |
          # Build INTO the base prefix (install/) so ament_package et al. resolve
          # in the same prefix (a separate --install-base breaks ros_workspace and
          # ament-python consumers). Snapshot first, then extract this shard's delta.
          touch /tmp/base_marker
          source install/setup.sh
          SEL=$(grep -vE '^\s*#|^\s*$' "ci/shards/dom_${{ matrix.shard }}.txt" | tr '\n' ' ')
          [ -z "$SEL" ] && { echo "empty shard"; exit 0; }
          colcon build --packages-select $SEL --merge-install \
            --executor parallel --parallel-workers $(sysctl -n hw.ncpu) --continue-on-error \
            --cmake-args -DCMAKE_TOOLCHAIN_FILE="${CMAKE_TOOLCHAIN_FILE}" -DCI_BUILD=TRUE \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee "build_${{ matrix.shard }}.log"
          mkdir -p install_shard
          find install -type f -newer /tmp/base_marker 2>/dev/null | while read -r f; do
            rel="${f#install/}"; mkdir -p "install_shard/$(dirname "$rel")"; cp -p "$f" "install_shard/$rel"
          done
      - name: Summarize shard
        if: always()
        run: |
          mkdir -p summaries
          { echo "## shard: ${{ matrix.shard }}"; grep -E 'Summary:|packages failed' "build_${{ matrix.shard }}.log" 2>/dev/null || true; grep -E 'Failed +<<<' "build_${{ matrix.shard }}.log" 2>/dev/null | sort -u || true; } > "summaries/${{ matrix.shard }}.txt"
      - name: Upload shard delta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-dom-${{ matrix.shard }}
          path: install_shard
          if-no-files-found: ignore
          retention-days: 2
      - name: Upload shard summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summary-${{ matrix.shard }}
          path: summaries
          retention-days: 5

  assemble:
    needs: domains
    if: always()
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@v4
        with: { name: install-base, path: install }
      - uses: actions/download-artifact@v4
        with: { pattern: install-dom-*, path: deltas }
      - name: Merge shard deltas
        run: |
          if [ -d deltas ]; then find deltas -mindepth 1 -maxdepth 1 -type d | while read -r d; do rsync -a "$d/" install/; done; fi
          du -sh install || true
      - name: Upload full workspace install
        uses: actions/upload-artifact@v4
        with:
          name: install-full-humble
          path: install
          retention-days: 5

  report:
    needs: [base-1, base-2, domains]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: summary-*, path: summaries, merge-multiple: true }
      - name: Combined report
        run: |
          echo "# Humble layered build — per-shard results" >> "$GITHUB_STEP_SUMMARY"
          for f in summaries/*.txt; do [ -f "$f" ] || continue; echo "- **$(basename "$f" .txt)**: $(grep -c 'Failed  *<<<' "$f" || true) failed" >> "$GITHUB_STEP_SUMMARY"; done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -rhE 'Failed +<<<' summaries/ | sort -u >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
