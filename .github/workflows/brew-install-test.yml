name: Homebrew install test

# Installs ros2-<distro> the way a user does -- `brew tap` + `brew install` -- on a fresh
# runner, then runs the SAME functional checks the package-smoke workflows run on the
# packaged tree (ci/deploy/functional_smoke.sh), against the installed keg.
#
# What this covers that package-smoke cannot: the formula itself (url/sha256, install,
# post_install, keg_only), Homebrew's own install-time processing of ~5,800 mach-o files,
# the keg living in Cellar/ behind the opt/ symlink, and a machine with NONE of the
# build's Homebrew dependencies installed -- the formula no longer declares any.
#
# Install from the tap's `next` branch (default) to test a pre-release without touching
# what `brew upgrade` serves from main.

on:
  workflow_dispatch:
    inputs:
      distro:
        type: choice
        options: ["kilted", "jazzy", "humble"]
        default: kilted
      tap_branch:
        description: "Branch of idesign0/homebrew-ros2 to install from"
        default: next

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      DISTRO: ${{ inputs.distro }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.distro }}-new
          submodules: false

      - name: What this machine has before the install
        run: |
          echo "python.org frameworks: $(ls /Library/Frameworks/Python.framework/Versions/ | tr '\n' ' ')"
          hits=$(brew list --formula | grep -E '^(qt|qtbase|qt@5|vtk|opencv|pcl|ogre.*|dartsim|gz-.*|boost.*|abseil|protobuf)$' || true)
          echo "build-side formulae already installed: ${hits:-none}"

      - name: Python modules the formula's caveats ask for
        run: |
          /Library/Frameworks/Python.framework/Versions/3.11/bin/python3 -m pip install -q \
            --break-system-packages empy==3.3.4 lark==1.1.1 catkin_pkg netifaces osrf-pycommon \
            PyYAML packaging psutil typeguard jinja2 lxml numpy \
            argcomplete typing_extensions

      - name: brew install from the tap
        run: |
          set -euo pipefail
          brew tap idesign0/ros2
          T="$(brew --repo idesign0/ros2)"
          git -C "$T" fetch -q origin "${{ inputs.tap_branch }}"
          git -C "$T" checkout -q -B "${{ inputs.tap_branch }}" FETCH_HEAD
          grep -nE '^  (version|sha256|depends_on) ' "$T/Formula/ros2-$DISTRO.rb"
          before=$(brew list --formula | wc -l | tr -d ' ')
          start=$(date +%s)
          mkdir -p report
          rc=0; brew install "idesign0/ros2/ros2-$DISTRO" > report/brew-install.log 2>&1 || rc=$?
          # tail alone hid the failure: the caveats are the last 40 lines either way
          grep -nE '^(Error|Warning):|Failed|failed' report/brew-install.log | head -40 || true
          tail -15 report/brew-install.log
          cp -R "$HOME/Library/Logs/Homebrew/ros2-$DISTRO" report/homebrew-logs 2>/dev/null || true
          [ "$rc" = 0 ] || { echo "::error::brew install exited $rc (full log in the artifact)"; exit "$rc"; }
          echo "install took $(( $(date +%s) - start ))s"
          after=$(brew list --formula | wc -l | tr -d ' ')
          echo "formulae installed alongside: $((after - before - 1))"
          brew list --versions "ros2-$DISTRO"
          ls -la "$(brew --prefix)/opt/ros2-$DISTRO"

      - name: Functional checks on the installed keg
        run: |
          # A stock Mac has /usr/bin/ruby only (bin/gz is `#!/usr/bin/env ruby`); the runner
          # image puts a newer Homebrew ruby first on PATH, which would hide a dependency.
          mkdir -p /tmp/sysruby && ln -sf /usr/bin/ruby /tmp/sysruby/ruby
          export PATH="/tmp/sysruby:/Library/Frameworks/Python.framework/Versions/3.11/bin:$PATH"
          bash ci/deploy/functional_smoke.sh "$(brew --prefix)/opt/ros2-$DISTRO"

      - name: Every path in the installed keg points inside the keg or at the system
        if: ${{ !cancelled() }}
        run: |
          # Not "does it exist on this machine": GitHub's runners carry python.org 3.12 and
          # Homebrew simdjson, so jazzy 26.11.16.7 passed that while linking both. Every
          # absolute path must point inside the keg (python.org 3.11 and the system aside),
          # every @rpath load must resolve inside it, and no file may name the build machine.
          set -o pipefail
          if [ -f ci/deploy/check_keg_paths.py ]; then
            python3 -I ci/deploy/check_keg_paths.py "$(brew --prefix)/opt/ros2-$DISTRO" \
              --prefix "$(brew --prefix)/opt/ros2-$DISTRO" --allow ci/deploy/keg-paths-allow.txt \
              --report report/keg-paths.txt
          else
            python3 ci/deploy/check_load_paths.py "$(brew --prefix)/opt/ros2-$DISTRO" | tee report/load-paths.txt
          fi

      - name: ros2 CLI -- talker/listener from a sourced zsh
        if: ${{ !cancelled() }}
        run: |
          export PATH="/Library/Frameworks/Python.framework/Versions/3.11/bin:$PATH"
          cat > /tmp/chat.zsh <<'ZSH'
          source "$(brew --prefix)/opt/ros2-$DISTRO/setup.zsh"
          echo "packages: $(ros2 pkg list | wc -l | tr -d ' ')"
          ros2 run demo_nodes_cpp talker > /tmp/talker.log 2>&1 &
          tp=$!
          ros2 topic echo /chatter std_msgs/msg/String --once > /tmp/echo.log 2>&1 &
          ep=$!
          for _ in $(seq 40); do kill -0 $ep 2>/dev/null || break; sleep 1; done
          kill $tp $ep 2>/dev/null
          if grep -q 'Hello World' /tmp/echo.log; then echo "talker -> listener OK: $(grep -m1 'Hello World' /tmp/echo.log)"; exit 0; fi
          echo "::error::no message on /chatter"; tail -20 /tmp/talker.log /tmp/echo.log; exit 1
          ZSH
          zsh /tmp/chat.zsh

      - name: The caveats' zsh block -- Cyclone lo0 talker/listener, colcon completion, map_server
        if: ${{ !cancelled() }}
        run: |
          # The lines `brew info` tells users to put in ~/.zshrc, run as written, so a
          # green install test also stands for the setup users actually copy. map_server
          # reads a .pgm through the keg's GraphicsMagick coder modules (MAGICK_* env hook).
          mkdir -p report
          cat > /tmp/caveats.zsh <<'ZSH'
          export PATH="/Library/Frameworks/Python.framework/Versions/3.11/bin:$PATH"
          K="$(brew --prefix)/opt/ros2-$DISTRO"
          source "$K/setup.zsh" 2> /tmp/source_err.txt
          autoload bashcompinit && bashcompinit
          eval "$(register-python-argcomplete colcon)"
          export RMW_IMPLEMENTATION=rmw_cyclonedds_cpp ROS_DOMAIN_ID=42
          export CYCLONEDDS_URI='<CycloneDDS><Domain><General><Interfaces><NetworkInterface name="lo0" multicast="true"/></Interfaces></General><Discovery><ParticipantIndex>none</ParticipantIndex></Discovery></Domain></CycloneDDS>'
          fails=0

          nf=$(grep -c 'not found' /tmp/source_err.txt)
          [ "$nf" = 0 ] || { echo "::warning::sourcing setup.zsh printed $nf 'not found' line(s)"; cat /tmp/source_err.txt; }

          if whence -w _python_argcomplete >/dev/null; then echo "colcon completion OK"
          else echo "::error::colcon completion not registered"; fails=$((fails+1)); fi

          ros2 run demo_nodes_cpp listener > /tmp/c_listener.log 2>&1 &
          ros2 run demo_nodes_cpp talker   > /tmp/c_talker.log 2>&1 &
          for _ in $(seq 40); do grep -q 'I heard' /tmp/c_listener.log && break; sleep 1; done
          pkill -f 'demo_nodes_cpp/(talker|listener)$'; pkill -f 'ros2 run demo_nodes_cpp'
          if grep -q 'I heard' /tmp/c_listener.log; then echo "Cyclone lo0 talker -> listener OK"
          else echo "::error::Cyclone lo0: listener heard nothing"; tail -20 /tmp/c_talker.log /tmp/c_listener.log; fails=$((fails+1)); fi

          M="$K/share/turtlebot4_navigation/maps/warehouse.yaml"
          [ -f "$M" ] || M=$(grep -l '\.pgm' "$K"/share/nav2_bringup/maps/*.yaml 2>/dev/null | head -1)
          if [ -z "$M" ] || [ ! -x "$K/lib/nav2_map_server/map_server" ]; then
            echo "::warning::no nav2 map_server or .pgm map in this keg -- map check skipped"
          else
            "$K/lib/nav2_map_server/map_server" --ros-args -p yaml_filename:="$M" > /tmp/map.log 2>&1 &
            mp=$!
            # no `timeout` here: it is GNU coreutils, not on a stock Mac
            sleep 5; ros2 lifecycle set /map_server configure > /tmp/map_cfg.log 2>&1 &
            cp_=$!
            for _ in $(seq 30); do kill -0 $cp_ 2>/dev/null || break; sleep 1; done
            kill $cp_ 2>/dev/null; sleep 2
            kill $mp 2>/dev/null; wait $mp 2>/dev/null
            if grep -q 'Read map' /tmp/map.log; then echo "map_server OK: $(grep -o 'Read map.*' /tmp/map.log)"
            else echo "::error::map_server could not read $M"; tail -20 /tmp/map.log; fails=$((fails+1)); fi
          fi
          cp /tmp/source_err.txt /tmp/c_*.log /tmp/map.log /tmp/map_cfg.log report/ 2>/dev/null
          exit $fails
          ZSH
          zsh /tmp/caveats.zsh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brew-install-test-${{ inputs.distro }}
          path: report
          retention-days: 7
          if-no-files-found: ignore
